modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Lets Dark Mode Everywhere darken Create's player inventory, the frogport and mailbox screens and the clipboard,
following its toggle. Client only.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Targets DME, so optional: without DME it does nothing.
[[mixins]]
config="${mod_id}.dme.mixins.json"

# Targets ImmediatelyFast, so optional.
[[mixins]]
config="${mod_id}.immediatelyfast.mixins.json"

# Targets Sophisticated Core, so optional.
[[mixins]]
config="${mod_id}.sophisticated.mixins.json"

# Targets Block Factory's Bosses (its dodge roll icon), so optional.
[[mixins]]
config="${mod_id}.bosses.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="darkmodeeverywhere"
    type="optional"
    versionRange="[1.4,)"
    ordering="AFTER"
    side="CLIENT"
