# On every push to main that changes it: an immutable versioned release (v<mod_version>-<sha7>, the two jars and the zip,
# for the Haven pack to pin by hash) and the rolling "latest" release (the zip linked from the README).
name: release
on:
  push:
    branches: [main]
    paths: [mod/**, mobbars/**, resourcepacks/**, tools/release.sh, tools/INSTALL.txt, tools/dme.sha512]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: tools/release.sh
      - name: Replace the latest release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/create-ui-remix.zip --title "Create UI Remix (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Install steps: INSTALL.txt in the zip, or the README." --latest
      - name: Create the versioned release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ver="$(grep '^mod_version=' mod/gradle.properties | cut -d= -f2)"
          tag="v${ver}-${GITHUB_SHA::7}"
          gh release create "$tag" dist/haven-create-ui-ux-*.jar dist/haven-mob-health-bars-*.jar dist/create-ui-remix.zip \
            --target "$GITHUB_SHA" --title "Create UI Remix ${ver} (${GITHUB_SHA::7})" \
            --notes "Immutable build of ${GITHUB_SHA::7}, for pinning by hash (the Haven pack). The README links the rolling 'latest'." \
            --latest=false
